<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 95" width="420" height="95">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=Jost:wght@300;400&amp;display=swap');
    </style>
  </defs>

  <!-- LEFT CURTAIN DRAPE -->
  <g fill="none" stroke="#b8975a" stroke-width="1.2" stroke-linecap="round">
    <!-- Curtain rod -->
    <line x1="14" y1="18" x2="58" y2="18" stroke-width="1.8"/>
    <!-- Rod finial left -->
    <circle cx="13" cy="18" r="3" fill="#b8975a" stroke="none"/>
    <!-- Rod finial right -->
    <circle cx="59" cy="18" r="3" fill="#b8975a" stroke="none"/>

    <!-- Curtain rings -->
    <circle cx="20" cy="18" r="2.5" stroke="#b8975a" stroke-width="1"/>
    <circle cx="29" cy="18" r="2.5" stroke="#b8975a" stroke-width="1"/>
    <circle cx="38" cy="18" r="2.5" stroke="#b8975a" stroke-width="1"/>
    <circle cx="47" cy="18" r="2.5" stroke="#b8975a" stroke-width="1"/>
    <circle cx="56" cy="18" r="2.5" stroke="#b8975a" stroke-width="1"/>

    <!-- Left curtain panel — pulled back with swag -->
    <path d="M20 20.5 C18 35, 14 45, 16 65 C17 75, 20 85, 18 100 C17 108, 15 112, 14 116"
          stroke="#2a2520" stroke-width="1.2" fill="none"/>
    <!-- Left panel inner fold -->
    <path d="M29 20.5 C27 32, 24 42, 26 58 C27 68, 30 78, 28 95 C27 103, 25 110, 24 116"
          stroke="#2a2520" stroke-width="0.8" fill="none" stroke-dasharray="none" opacity="0.5"/>
    <!-- Left panel — right edge (pulled back) -->
    <path d="M56 20.5 C60 30, 64 42, 60 58 C57 70, 52 80, 54 98 C55 107, 57 112, 58 116"
          stroke="#2a2520" stroke-width="1.2" fill="none"/>


  </g>

  <!-- DIVIDER LINE -->
  <line x1="72" y1="14" x2="72" y2="106" stroke="#ddd5c5" stroke-width="1"/>

  <!-- TEXT BLOCK -->
  <text x="86" y="52"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="36"
        font-weight="300"
        letter-spacing="2"
        fill="#2a2520">Christine's</text>

  <text x="86" y="82"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="36"
        font-weight="300"
        font-style="italic"
        letter-spacing="1"
        fill="#b8975a">Curtains</text>


</svg>
